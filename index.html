<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Rock Paper Scissors</title>
</head>
<body>
    
    <div class="bg-gradient-to-br from-olive-50 via-purple-100 to-olive-200 min-h-screen pb-10 flex flex-col items-center ">  
        <h1 class="text-4xl font-bold text-center mt-8">👊🏻Rock  🤚🏻Paper ✂️Scissors</h1>

        <div class="flex flex-col lg:flex-row items-center justify-center lg:w-9/12 mx-auto mt-12 gap-4 w-full lg:width-9/12 mx-auto">

            <button id="rock"  
                class="bg-gradient-to-br from-slate-500 via-slate-800 to-slate-600 border-2 border-slate-900 text-white  text-xl lg:text-2xl font-bold px-16 py-4 rounded-lg shadow-md hover:scale-105 hover:brightness-110 hover:bg-slate-600 transition duration-300 uppercase">
            
                👊🏻 Rock
            </button>


            <button id="paper" 
                class="bg-gradient-to-br from-yellow-50 via-yellow-200 to-yellow-100 border-2 border-yellow-500 text-slate-800 text-xl lg:text-2xl font-bold px-16 py-4 rounded-lg shadow-md hover:scale-105 hover:brightness-110 hover:bg-yellow-600 transition duration-300 uppercase"> 
            
                🤚🏻 Paper
            </button>



              <button id="scissors" 
                class="bg-gradient-to-br from-gray-50 via-gray-300 to-gray-200 border-2 border-gray-500 text-slate-800 text-xl lg:text-2xl font-bold px-16 py-4 rounded-lg shadow-md hover:scale-105 hover:brightness-110 hover:bg-gray-600 transition duration-300 uppercase"> 
            
                ✂️ Scissors
            </button>
        </div>

        <div class="mt-6">
            <button id="restart"
            class="px-8 py-4 rounded-lg border-2 border-rose-500 bg-gradient-to-br from-rose-50 via-rose-200 to-rose-100 text-rose-800 text-xl font-bold hover:scale-105 hover:brightness-110 hover:bg-rose-600 transition duration-300 uppercase"
            >Restart</button>
        </div>

        <div id="score-panel"
        
            class="mt-8 text-2xl font-bold text-slate-800">
            Player : <span id="player-score">0</span>   |   Computer : <span id="computer-score">0 </span>

        </div>


        <div id="result"
            class="mt-12  text-2xl lg:text-3xl font-semibold text-center text-slate-800">
             <!-- Result will be displayed here -->

        </div>
        
 

</div>


    <script src="script.js"></script>
</body>
</html>
