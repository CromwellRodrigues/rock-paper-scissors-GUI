<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Rock Paper Scissors</title>
</head>
<body>
    
    <div class="bg-gradient-to-br from-olive-50 via-purple-100 to-olive-200 h-screen flex flex-col items-center  "> 
        <h1 class="text-4xl font-bold text-center mt-8">👊🏻Rock  🤚🏻Paper ✂️Scissors</h1>

        <div class="flex items-center justify-center w-9/12 mx-auto mt-12 space-x-8">

            <button id="rock"  
                class="bg-gradient-to-br from-slate-500 via-slate-800 to-slate-600 border-2 border-slate-900 text-white text-2xl font-bold px-16 py-8 rounded-lg shadow-md hover:scale-105 hover:brightness-110 hover:bg-slate-600 transition duration-300 uppercase">
            
                👊🏻 Rock
            </button>


            <button id="paper" 
                class="bg-gradient-to-br from-yellow-50 via-yellow-200 to-yellow-100 border-2 border-yellow-500 text-slate-800 text-2xl font-bold px-16 py-8 rounded-lg shadow-md hover:scale-105 hover:brightness-110 hover:bg-yellow-600 transition duration-300 uppercase"> 
            
                🤚🏻 Paper
            </button>



              <button id="scissors" 
                class="bg-gradient-to-br from-gray-50 via-gray-300 to-gray-200 border-2 border-gray-500 text-slate-800 text-2xl font-bold px-16 py-8 rounded-lg shadow-md hover:scale-105 hover:brightness-110 hover:bg-gray-600 transition duration-300 uppercase"> 
            
                ✂️ Scissors
            </button>
        </div>

        <div id="result"
            class="mt-12 text-3xl font-semibold text-center text-slate-800">
             <!-- Result will be displayed here -->

        </div>
        
 

</div>


    <script src="script.js"></script>
</body>
</html>
